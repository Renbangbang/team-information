<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习资源 - 课题组自助学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 2rem;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        nav ul li a:hover {
            color: #3498db;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #2c3e50;
        }
        
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }
        
        .resource-card {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .resource-card:hover {
            transform: translateY(-5px);
        }
        
        .resource-header {
            background-color: #3498db;
            color: white;
            padding: 1rem;
        }
        
        .resource-header h3 {
            margin-bottom: 0.5rem;
        }
        
        .resource-type {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .resource-body {
            padding: 1.5rem;
        }
        
        .resource-body p {
            margin-bottom: 1rem;
            color: #666;
        }
        
        .resource-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
        }
        
        .resource-meta .author {
            font-weight: bold;
        }
        
        .resource-meta .date {
            font-style: italic;
        }
        
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.6rem 1.5rem;
            text-decoration: none;
            border-radius: 3px;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
        
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">课题组自助学习平台</div>
            <ul>
                <li><a href="{{ url_for('index') }}">首页</a></li>
                <li><a href="{{ url_for('about') }}">关于我们</a></li>
                <li><a href="{{ url_for('resources') }}">学习资源</a></li>
                <li><a href="{{ url_for('forum') }}">交流论坛</a></li>
                <li><a href="{{ url_for('contact') }}">联系我们</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container">
        <h1 class="section-title">学习资源</h1>
        
        <div class="resources-grid">
            {% for resource in resources %}
            <div class="resource-card">
                <div class="resource-header">
                    <h3>{{ resource.title }}</h3>
                    <div class="resource-type">{{ resource.resource_type }}</div>
                </div>
                <div class="resource-body">
                    <p>{{ resource.description }}</p>
                    <div class="resource-meta">
                        <span class="author">作者: {{ resource.author }}</span>
                        <span class="date">上传日期: {{ resource.upload_date.strftime('%Y-%m-%d') }}</span>
                    </div>
                    <a href="{{ resource.file_url }}" class="btn" target="_blank">查看资源</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 课题组自助学习平台. 保留所有权利.</p>
    </footer>
</body>
</html>

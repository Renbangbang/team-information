<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if member %}编辑帖子{% else %}添加帖子{% endif %} - 课题组自助学习平台</title>
    <style>
        /* 基本样式与列表页类似 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f4f4f4;
        }
        .admin-header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 1.5rem; }
        .admin-header a { color: white; text-decoration: none; margin-left: 1rem; }
        .admin-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: #333;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .form-group textarea {
            height: 100px;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn:hover { background: #2980b9; }
        .btn-cancel {
            background: #95a5a6;
            margin-left: 1rem;
        }
        .btn-cancel:hover { background: #7f8c8d; }
        .flash-message {
            margin-bottom: 1rem;
            padding: 0.7rem;
            border-radius: 3px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-danger  { background: #f8d7da; color: #721c24; }
        .flash-warning { background: #fff3cd; color: #856404; }
        .flash-info    { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>{% if member %}编辑成员{% else %}添加成员{% endif %}</h1>
        <div>
            <span>{{ session.username }}</span>
            <a href="{{ url_for('admin_members') }}">返回列表</a>
            <a href="{{ url_for('logout') }}">退出</a>
        </div>
    </header>
    <div class="admin-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <label for="title">标题 <span style="color:red;">*</span></label>
                <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required>
            </div>
            <div class="form-group">
                <label for="content">内容 <span style="color:red;">*</span></label>
                <textarea id="content" name="content" rows="8" required>{{ post.content if post else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="author">作者 <span style="color:red;">*</span></label>
                <input type="text" id="author" name="author" value="{{ post.author if post else '' }}" required>
            </div>
            <div class="form-group">
                <label for="category">分类</label>
                <input type="text" id="category" name="category" value="{{ post.category if post else '' }}">
            </div>
            <button type="submit" class="btn">保存</button>
            <a href="{{ url_for('admin_posts') }}" class="btn btn-cancel">取消</a>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}编辑成果{% else %}添加成果{% endif %} - 课题组自助学习平台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f4f4f4;
        }
        .admin-header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 1.5rem; }
        .admin-header a { color: white; text-decoration: none; margin-left: 1rem; }
        .admin-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: #333;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-family: inherit;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background: #2980b9; }
        .btn-cancel {
            background: #95a5a6;
            margin-left: 1rem;
        }
        .btn-cancel:hover { background: #7f8c8d; }
        .flash-message {
            margin-bottom: 1rem;
            padding: 0.7rem;
            border-radius: 3px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-danger  { background: #f8d7da; color: #721c24; }
        .flash-warning { background: #fff3cd; color: #856404; }
        .flash-info    { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>{% if product %}编辑成果{% else %}添加成果{% endif %}</h1>
        <div>
            <span>{{ session.username }}</span>
            <a href="{{ url_for('admin_products') }}">返回列表</a>
            <a href="{{ url_for('logout') }}">退出</a>
        </div>
    </header>
    <div class="admin-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <label for="name">作品名称 *</label>
                <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required>
            </div>
            <div class="form-group">
                <label for="author">作者</label>
                <input type="text" id="author" name="author" value="{{ product.author if product else '' }}">
            </div>
            <div class="form-group">
                <label for="time">发表时间</label>
                <input type="text" id="time" name="time" value="{{ product.time if product else '' }}" placeholder="例如: 2025-01">
            </div>
            <div class="form-group">
                <label for="type">类型 *</label>
                <select id="type" name="type" required>
                    <option value="">请选择</option>
                    <option value="论文" {% if product and product.type == '论文' %}selected{% endif %}>论文</option>
                    <option value="专利" {% if product and product.type == '专利' %}selected{% endif %}>专利</option>
                </select>
            </div>
            <div class="form-group">
                <label for="url">链接</label>
                <input type="url" id="url" name="url" value="{{ product.url if product else '' }}" placeholder="https://...">
            </div>
            <button type="submit" class="btn">保存</button>
            <a href="{{ url_for('admin_products') }}" class="btn btn-cancel">取消</a>
        </form>
    </div>
</body>
</html>

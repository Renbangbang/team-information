<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if resource %}编辑资源{% else %}添加资源{% endif %} - 课题组自助学习平台</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f4f4f4;
        }
        .admin-header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-size: 1.5rem; }
        .admin-header a { color: white; text-decoration: none; margin-left: 1rem; }
        .admin-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: #333;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
        }
        .btn {
            background: #3498db;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background: #2980b9; }
        .btn-cancel {
            background: #95a5a6;
            margin-left: 1rem;
        }
        .btn-cancel:hover { background: #7f8c8d; }
        .flash-message {
            margin-bottom: 1rem;
            padding: 0.7rem;
            border-radius: 3px;
        }
        .flash-success { background: #d4edda; color: #155724; }
        .flash-danger  { background: #f8d7da; color: #721c24; }
        .flash-warning { background: #fff3cd; color: #856404; }
        .flash-info    { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>{% if resource %}编辑资源{% else %}添加资源{% endif %}</h1>
        <div>
            <span>{{ session.username }}</span>
            <a href="{{ url_for('admin_resources') }}">返回列表</a>
            <a href="{{ url_for('logout') }}">退出</a>
        </div>
    </header>
    <div class="admin-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <label for="title">标题 <span style="color:red;">*</span></label>
                <input type="text" id="title" name="title" value="{{ resource.title if resource else '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" name="description" rows="4">{{ resource.description if resource else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="resource_type">类型 <span style="color:red;">*</span></label>
                <select id="resource_type" name="resource_type" required>
                    <option value="">请选择类型</option>
                    {# 固定分类数组 #}
                    {% set types = ['教程', '书籍', '论文', '软件', '视频', '博客', '其他'] %}
                    {% for type in types %}
                        <option value="{{ type }}"
                            {% if resource and resource.resource_type == type %}selected{% endif %}>
                            {{ type }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="file_url">文件链接</label>
                <input type="url" id="file_url" name="file_url" value="{{ resource.file_url if resource else '' }}" placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="author">作者</label>
                <input type="text" id="author" name="author" value="{{ resource.author if resource else '' }}">
            </div>
            <button type="submit" class="btn">保存</button>
            <a href="{{ url_for('admin_resources') }}" class="btn btn-cancel">取消</a>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交流论坛 - 课题组自助学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 2rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #3498db;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #2c3e50;
        }

        .forum-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .posts-list {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .post-card {
            border-bottom: 1px solid #eee;
            padding: 1.5rem 0;
        }

        .post-card:last-child {
            border-bottom: none;
        }

        .post-header {
            margin-bottom: 1rem;
        }

        .post-title {
            font-size: 1.3rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .post-meta {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .post-content {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .post-actions {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .post-actions a {
            color: #3498db;
            text-decoration: none;
        }

        .post-actions a:hover {
            text-decoration: underline;
        }

        .sidebar {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .sidebar h3 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .category-list {
            list-style: none;
        }

        .category-list li {
            margin-bottom: 0.5rem;
        }

        .category-list li a {
            color: #333;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .category-list li a:hover {
            color: #3498db;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.6rem 1.5rem;
            text-decoration: none;
            border-radius: 3px;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">课题组自助学习平台</div>
            <ul>
                <li><a href="/index.html">首页</a></li>
                <li><a href="./about.html">关于我们</a></li>
                <li><a href="./resources.html">学习资源</a></li>
                <li><a href="./forum.html">交流论坛</a></li>
                <li><a href="./contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">交流论坛</h1>

        <div class="forum-container">

            <div class="posts-list" id="posts-container">
                <!-- 由 JavaScript 动态填充 -->
            </div>

            <div class="sidebar">
                <h3>论坛分类</h3>
                <ul class="category-list">
                    <li><a href="#">通知公告</a></li>
                    <li><a href="#">科研经验</a></li>
                    <li><a href="#">学习心得</a></li>
                    <li><a href="#">问题求助</a></li>
                    <li><a href="#">资源共享</a></li>
                    <li><a href="#">学术讨论</a></li>
                </ul>

                <a href="#" class="btn">发布新帖</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 课题组自助学习平台. 保留所有权利.</p>
    </footer>

    <script>
        fetch('/instance/data/posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = posts.map(post => `
                    <div class="post-card">
                        <div class="post-header">
                            <h2 class="post-title">${post.title}</h2>
                            <div class="post-meta">
                                <span>作者: ${post.author}</span>
                                <span>发布日期: ${post.post_date}</span>
                                <span>分类: ${post.category}</span>
                            </div>
                        </div>
                        <div class="post-content">
                            <p>${post.content.replace(/\n/g, '<br>')}</p>
                        </div>
                        <div class="post-actions">
                            <a href="#">回复</a>
                            <a href="#">分享</a>
                            <a href="#">收藏</a>
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('加载帖子数据失败:', error));
    </script>
</body>
</html>

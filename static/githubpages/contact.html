<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 课题组自助学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 2rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #3498db;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #2c3e50;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .contact-info {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .contact-info h3 {
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        .contact-details {
            margin-bottom: 2rem;
        }

        .contact-details p {
            margin-bottom: 1rem;
        }

        .contact-details strong {
            color: #2c3e50;
        }

        .social-links {
            list-style: none;
        }

        .social-links li {
            margin-bottom: 0.5rem;
        }

        .social-links li a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-links li a:hover {
            color: #2980b9;
        }

        .contact-form {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .contact-form h3 {
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        /* 并排容器：让链接列表靠左，二维码靠右 */
        .contact-qr-row {
            display: flex;
            justify-content: space-between;  /* 左右分开 */
            align-items: flex-start;         /* 顶部对齐 */
            flex-wrap: wrap;                 /* 小屏换行 */
        }

        .social-links {
            margin: 0;                        /* 重置默认边距 */
            padding: 0;
            flex: 0 1 auto;                   /* 不自动拉伸，宽度由内容决定 */
        }

        .qr-code {
            text-align: center;
            max-width: 160px;                  /* 限制二维码大小 */
            margin-left: 2rem;                  /* 与左侧保持间距（当并排时） */
        }

        .qr-code img {
            width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #f5f5f5;
        }

        .qr-code p {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        /* 小屏幕时改为列居中 */
        @media (max-width: 600px) {
            .contact-qr-row {
                justify-content: center;       /* 换行后整体居中 */
                gap: 1.5rem;
            }
            .qr-code {
                margin-left: 0;                 /* 取消左侧间距 */
                max-width: 180px;
            }
            .social-links {
                text-align: center;             /* 链接文本居中 */
                width: 100%;
            }
            .social-links li {
                display: inline-block;           /* 小屏下链接可以横排（可选） */
                margin: 0 0.5rem;
            }
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">课题组自助学习平台</div>
            <ul>
                <li><a href="../../index.html">首页</a></li>
                <li><a href="./about.html">关于我们</a></li>
                <li><a href="./resources.html">学习资源</a></li>
                <li><a href="./publications.html">论文专利</a></li>
                <li><a href="./contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">联系我们</h1>

        <div class="contact-container">
            <div class="contact-info">
                <h3>联系方式</h3>
                <div class="contact-details">
                    <p><strong>地址:</strong> 大学计算机科学与技术学院科研楼501室</p>
                    <p><strong>电话:</strong> 010-12345678</p>
                    <p><strong>邮箱:</strong> research@university.edu</p>
                    <p><strong>办公时间:</strong> 周一至周五 9:00-17:00</p>
                </div>
            </div>


            <div class="contact-form">
                <h3>关注我们</h3>
                <!-- 链接列表与二维码并排，且二维码靠右 -->
                <div class="contact-qr-row">
                    <ul class="social-links">
                        <li><a href="../../index.html">课题组官网</a></li>
                        <li><a href="https://github.com/Renbangbang/team-information" target="_blank">GitHub仓库</a></li>
                        <li><a href="./publications.html">学术论文</a></li>
                    </ul>
                    <div class="qr-code">
                        <!-- 使用占位图演示，请替换为真实二维码 -->
                        <img src="../../static/picture/wechat-qrcode.png" alt="微信公众号二维码">
                        <p>扫一扫关注公众号</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 课题组自助学习平台. 保留所有权利.</p>
    </footer>
</body>
</html>

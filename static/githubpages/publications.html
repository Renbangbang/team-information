<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文专利 - 课题组自助学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
        }
        nav ul li {
            margin-left: 2rem;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #3498db;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #2c3e50;
        }
        /* 年份筛选 */
        .year-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .year-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .year-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        .year-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        /* 论文列表 */
        .year-section {
            margin-bottom: 2.5rem;
        }
        .year-heading {
            font-size: 1.6rem;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.3rem;
            margin-bottom: 1rem;
        }
        .publication-list {
            list-style: none;
        }
        .publication-item {
            margin-bottom: 1.2rem;
            padding-left: 1rem;
            border-left: 3px solid transparent;
            transition: border-color 0.2s;
        }
        .publication-item:hover {
            border-left-color: #3498db;
        }
        .publication-authors {
            font-weight: 500;
        }
        .publication-title {
            font-size: 1.1rem;
            margin: 0.2rem 0;
        }
        .publication-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        .publication-title a:hover {
            text-decoration: underline;
            color: #3498db;
        }
        .publication-venue {
            color: #666;
            font-style: italic;
            font-size: 0.95rem;
        }
        .publication-type {
            display: inline-block;
            background: #e1f0fa;
            color: #2980b9;
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            margin-left: 0.5rem;
        }
        .publication-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .publication-year {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">课题组自助学习平台</div>
            <ul>
                <li><a href="../../index.html">首页</a></li>
                <li><a href="./about.html">关于我们</a></li>
                <li><a href="./resources.html">学习资源</a></li>
                <li><a href="./publications.html" class="active">论文专利</a></li>
                <li><a href="./contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">科研成果</h1>

        <!-- 年份筛选按钮容器 -->
        <div class="year-filter" id="year-filter"></div>

        <!-- 按年份分组展示容器 -->
        <div id="publications-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 课题组自助学习平台. 保留所有权利.</p>
    </footer>

    <script>
        (function() {
            // 加载 publications.json 数据
            fetch('../../instance/data/publications.json')
                .then(response => response.json())
                .then(data => {
                    // 处理数据：按年份分组，并提取所有年份
                    const grouped = {};
                    const yearsSet = new Set();

                    data.forEach(item => {
                        // 从 time 字段提取年份（假设格式为 YYYY-MM）
                        const year = item.time.substring(0, 4);
                        yearsSet.add(year);
                        if (!grouped[year]) {
                            grouped[year] = [];
                        }
                        grouped[year].push(item);
                    });

                    // 将年份排序（降序，最近的在前面）
                    const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

                    // 渲染年份筛选按钮
                    renderYearFilter(sortedYears);

                    // 渲染所有年份的论文
                    renderPublications(grouped, sortedYears);

                    // 初始化筛选功能
                    initFilter();
                })
                .catch(error => {
                    console.error('加载论文数据失败:', error);
                    document.getElementById('publications-container').innerHTML = '<p style="color:red;">数据加载失败，请稍后重试。</p>';
                });

            // 渲染年份筛选按钮
            function renderYearFilter(years) {
                const filterDiv = document.getElementById('year-filter');
                let html = '<button class="year-btn active" data-year="all">全部</button>';
                years.forEach(year => {
                    html += `<button class="year-btn" data-year="${year}">${year}</button>`;
                });
                filterDiv.innerHTML = html;
            }

            // 渲染论文列表
            function renderPublications(grouped, sortedYears) {
                const container = document.getElementById('publications-container');
                let html = '';
                sortedYears.forEach(year => {
                    const items = grouped[year];
                    html += `<div class="year-section" data-year="${year}">`;
                    html += `<h2 class="year-heading">${year}</h2>`;
                    html += '<ul class="publication-list">';
                    items.forEach(item => {
                        html += `
                            <li class="publication-item">
                                <div class="publication-meta">
                                    <span class="publication-authors">${item.author}</span>
                                    <span class="publication-year">(${item.time})</span>
                                    <span class="publication-type">${item.type}</span>
                                </div>
                                <div class="publication-title">
                                    <a href="${item.url}" target="_blank">${item.name}</a>
                                </div>
                            </li>
                        `;
                    });
                    html += '</ul></div>';
                });
                container.innerHTML = html;
            }

            // 年份筛选功能
            function initFilter() {
                const yearButtons = document.querySelectorAll('.year-btn');
                const yearSections = document.querySelectorAll('.year-section');

                function filterByYear(year) {
                    yearSections.forEach(section => {
                        if (year === 'all' || section.dataset.year === year) {
                            section.style.display = 'block';
                        } else {
                            section.style.display = 'none';
                        }
                    });
                }

                yearButtons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        yearButtons.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const year = this.dataset.year;
                        filterByYear(year);
                    });
                });
            }
        })();
    </script>
</body>
</html>
